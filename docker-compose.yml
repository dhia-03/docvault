# Local development stack. The application is only reachable from this machine.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: docvault
      POSTGRES_USER: docvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docvault -d docvault"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://docvault:${POSTGRES_PASSWORD}@db:5432/docvault
      SEED_PASSWORD: ${SEED_PASSWORD:?Set SEED_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    volumes:
      - documents:/data
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  documents:

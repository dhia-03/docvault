# PostgreSQL, mirroring the db service in docker-compose.yml.
# Baseline version: no hardening. See F07 in docs/vulnerability-register.md.
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: docvault
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: docvault
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: docvault
            - name: POSTGRES_USER
              value: docvault
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docvault-secrets
                  key: POSTGRES_PASSWORD
            # A subdirectory, because the volume root may contain lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "docvault", "-d", "docvault"]
            periodSeconds: 3
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

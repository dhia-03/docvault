<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DocVault{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header>
      <a class="brand" href="/documents">DocVault</a>
      {% if user %}
      <nav>
        <a href="/documents">Documents</a>
        {% if user.role == "admin" %}<a href="/admin/users">Users</a>{% endif %}
        {% if user.role in ("admin", "auditor") %}<a href="/audit">Audit log</a>{% endif %}
        <a href="/account">Account</a>
        <span class="who">{{ user.username }} ({{ user.role }})</span>
        <form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Sign out</button></form>
      </nav>
      {% endif %}
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>

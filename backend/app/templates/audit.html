{% extends "base.html" %}
{% block title %}Audit log - DocVault{% endblock %}
{% block content %}
<h1>Audit log</h1>
<table>
  <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Target</th></tr></thead>
  <tbody>
    {% for entry in entries %}
    <tr>
      <td>{{ entry.created_at }}</td>
      <td>{{ entry.actor }}</td>
      <td>{{ entry.action }}</td>
      <td>{{ entry.target }}</td>
    </tr>
    {% else %}
    <tr><td colspan="4">No events recorded.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
